<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trợ lý UEL</title><style>body{margin:0;background:#f1f5f9;color:#17304c;font:16px system-ui}main{max-width:760px;margin:2rem auto;padding:1.5rem}header{border-bottom:1px solid #cbd5e1}#messages{min-height:40vh;display:flex;flex-direction:column;gap:1rem;padding:1.5rem 0}.bubble{background:white;border-radius:12px;padding:1rem;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#dbeafe;align-self:flex-end}small{display:block;color:#52667c;margin-top:.6rem}form{display:flex;gap:.5rem}input,textarea,button{font:inherit;padding:.7rem;border:1px solid #a8b9cc;border-radius:8px}textarea{flex:1}button{background:#164e80;color:white}label{display:block;margin-top:1rem}</style></head><body><main><header><h1>Trợ lý UEL</h1><p>Chọn mô-đun được cấp quyền để bắt đầu.</p></header><label for="key">API key</label><input id="key" type="password" autocomplete="off" placeholder="Nhập API key"><label for="module">Module</label><select id="module" aria-label="Module"></select><button type="button" id="loadModules">Tải mô-đun</button><div id="messages" aria-live="polite"><div class="bubble">Xin chào! Bạn cần hỗ trợ nội dung nào?</div></div><form id="form"><textarea id="message" aria-label="Câu hỏi" placeholder="Nhập câu hỏi của bạn" required maxlength="4000" rows="2"></textarea><button id="send">Gửi</button></form></main><script>
const form=document.querySelector('#form'), messages=document.querySelector('#messages'), input=document.querySelector('#message'), button=document.querySelector('#send'); let conversation=null;
function add(text, cls, detail=''){const node=document.createElement('div');node.className='bubble '+cls;node.textContent=text;if(detail){const meta=document.createElement('small');meta.textContent=detail;node.append(meta)}messages.append(node);node.scrollIntoView({block:'nearest'})}
form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim(),key=document.querySelector('#key').value;if(!message||!key){add('Vui lòng nhập API key và câu hỏi.','');return}add(message,'user');input.value='';button.disabled=true;try{const response=await fetch('/v1/chat',{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':key},body:JSON.stringify({message,conversation_id:conversation,...(document.querySelector("#module").value?{module_code:document.querySelector("#module").value}:{})})});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();conversation=data.conversation_id;const source=data.citations.map(c=>c.kind+': '+c.value).join(', ');add(data.answer,'', ['Trạng thái: '+data.status,source&&'Nguồn: '+source,data.support_contact,data.contact_information,data.online_channel].filter(Boolean).join(' | '))}catch(err){add('Không thể gửi câu hỏi: '+err.message,'')}finally{button.disabled=false;input.focus()}});

const moduleSelect=document.querySelector('#module');
moduleSelect.addEventListener('change',()=>{conversation=null;messages.replaceChildren()});
document.querySelector('#key').addEventListener('input',()=>{conversation=null;moduleSelect.replaceChildren();messages.replaceChildren()});
document.querySelector('#loadModules').addEventListener('click',async()=>{
  conversation=null;moduleSelect.replaceChildren();messages.replaceChildren();
  try { const r=await fetch('/v1/modules',{headers:{'X-API-Key':document.querySelector('#key').value}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();for(const item of data.modules){const o=document.createElement('option');o.value=item.code;o.textContent=item.name;moduleSelect.append(o)}
  } catch(e){add('Cannot load modules: '+e.message,'')}
});
</script></body></html>
