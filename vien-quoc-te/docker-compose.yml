name: uel-innovation

# Deploy n2nai: không ports:, mọi truy cập qua Traefik.
# https://monitor.n2nai.io/huong-dan/

x-logging: &default-logging
  driver: json-file
  options:
    max-file: "3"
    max-size: "10m"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    mem_limit: 512m
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:v1.12.6
    restart: unless-stopped
    mem_limit: 2g
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default-logging

  app:
    build: .
    restart: unless-stopped
    mem_limit: 8g
    env_file: .env
    environment:
      PYTHONPATH: /app
      EMBED_BACKEND: bge-m3
      MONGO_URI: mongodb://mongo:27017
      QDRANT_URL: http://qdrant:6333
      UI_DIST_DIR: /app/ui_dist
      DEPARTMENT_YAML: /app/configs/department.yaml
      PERSONA_YAML: /app/configs/persona.yaml
      CHATBOT_DATA_DIR: /app/chatbot-data
      COOKIE_SECURE: "true"
    volumes:
      - ./chatbot-data:/app/chatbot-data
      - ./chatbot-api/configs:/app/configs
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    labels:
      - traefik.enable=true
      - "traefik.http.routers.uel-innovation-app.rule=Host(`${N2NAI_HOST:-vanlg-uel-innovation.n2nai.io}`)"
      - traefik.http.services.uel-innovation-app.loadbalancer.server.port=8000
    logging: *default-logging

volumes:
  mongo_data:
    name: uel-innovation_starter_mongo_data
  qdrant_data:
    name: uel-innovation_starter_qdrant_data
